# ===== Application =====
spring.application.name=hotelbookingbackend
server.port=8080

# ===== Database (credentials come from environment variables) =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/hotel_booking_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== JPA / Hibernate =====
# "validate": on startup Hibernate checks that entities match the tables
# created by database/schema.sql. It never changes the schema itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false